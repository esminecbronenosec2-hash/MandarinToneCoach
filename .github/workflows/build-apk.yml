name: Mandarin Tone Coach v2 APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore:
      - '**/*.md'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK licenses
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - name: Android API 35
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Bundle offline Chinese speech recognition model (Apache 2.0)
        run: |
          mkdir -p app/src/main/assets
          curl --fail --location --retry 4 --retry-delay 5 \
            'https://alphacephei.com/vosk/models/vosk-model-small-cn-0.22.zip' \
            --output app/src/main/assets/vosk-model-small-cn-0.22.zip
          unzip -t app/src/main/assets/vosk-model-small-cn-0.22.zip | tail -2
          ls -lh app/src/main/assets/vosk-model-small-cn-0.22.zip
      - name: Compile and test
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MandarinToneCoach-v2-offline-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
