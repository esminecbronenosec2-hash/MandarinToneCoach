<html lang="ru">
<head>

<title>Mandarin Tone Coach</title>
<style>
:root{color-scheme:dark;--bg:#0a1022;--panel:#171f39;--panel2:#1d2845;--line:#303a56;--txt:#f4f6ff;--muted:#9eabc9;--accent:#9185ff;--aqua:#58d9d1;--gold:#ffd38f;--danger:#ff8094;--green:#67e8ac}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,'Noto Sans CJK SC','Microsoft YaHei',sans-serif;-webkit-tap-highlight-color:transparent}body{background:radial-gradient(ellipse at 10% -10%,#323066 0%,transparent 48%),radial-gradient(ellipse at 100% 20%,#102944 0%,transparent 42%),var(--bg)}button,input,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.52}textarea,input{outline:none}::-webkit-scrollbar{width:0;height:0}
.page{max-width:680px;margin:auto;min-height:100vh;padding:20px 18px calc(114px + env(safe-area-inset-bottom));position:relative}.header{display:flex;align-items:center;justify-content:space-between;margin:4px 0 28px;gap:14px}.logo{display:flex;align-items:center;gap:12px}.logo-mark{height:44px;width:44px;border-radius:16px;background:linear-gradient(135deg,#958bff,#6854b8);box-shadow:0 7px 24px #7b5afa50;display:grid;place-items:center;font-weight:900;font-size:25px;color:white}.brandname{font-size:17px;font-weight:800;letter-spacing:-.3px}.brandtag{color:var(--muted);font-size:12px;margin-top:3px}.model-badge{font-size:11px;border:1px solid #3b4b69;background:#1c2841;padding:8px 10px;border-radius:50px;white-space:nowrap;display:flex;align-items:center;gap:6px;color:#d4e5ff}.dot{width:7px;height:7px;background:#f7d074;border-radius:50%;display:inline-block;flex:none}.dot.ready{background:var(--green);box-shadow:0 0 9px #67e8ac80}.dot.error{background:var(--danger)}
.eyebrow{font-size:11px;color:#a9a4fb;font-weight:800;letter-spacing:2.4px;text-transform:uppercase;margin-bottom:12px}.big-title{font-size:32px;font-weight:850;line-height:1.14;letter-spacing:-1.25px;margin:0 0 11px}.sub{font-size:14px;line-height:1.6;color:var(--muted);margin:0 0 23px}.highlight{color:#b5b0ff}.card{background:linear-gradient(160deg,#1b2540,#141c33);border:1px solid #313b58;border-radius:25px;box-shadow:0 10px 26px #03091536;padding:18px;margin:16px 0}.card.glow{background:linear-gradient(145deg,#2a2a5c,#1c2b50 65%,#1a334e);border-color:#575294}.card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}.card-title{font-weight:760;font-size:15px}.tiny{color:var(--muted);font-size:12px;line-height:1.4}.caption{font-size:11px;letter-spacing:1.1px;text-transform:uppercase;color:#909ab9;font-weight:800;margin-bottom:9px}.field{width:100%;background:#111a30;color:var(--txt);border:1px solid #374363;border-radius:17px;padding:14px 15px;font-size:18px;line-height:1.5;resize:vertical;min-height:96px}.field:focus{border-color:#9990ff;box-shadow:0 0 0 3px #9185ff1b}.field::placeholder{color:#677696}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}.chip{border:1px solid #3d4869;border-radius:30px;background:#1f2b46;color:#dce2ff;padding:9px 12px;font-size:13px}.chip:active,.seg-btn:active,.big-btn:active{transform:scale(.98)}.chip.selected{border-color:#9286ff;background:#36345b}.pill{padding:5px 10px;border-radius:30px;color:#c1baff;background:#51498746;font-weight:750;font-size:11px}.tones{display:flex;flex-wrap:wrap;gap:7px}.tone-pill{min-width:34px;height:36px;padding:0 10px;border:1px solid #3b4b68;border-radius:10px;background:#273251;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}.tone-pill.t1{color:#c0b0ff}.tone-pill.t2{color:#56ded6}.tone-pill.t3{color:#ffd391}.tone-pill.t4{color:#ff9db5}.tone-pill.t5{color:#aab6d4}.pinyin-line{font-size:17px;color:#dbe4fc;letter-spacing:.8px;overflow-wrap:anywhere;min-height:28px}.helper{font-size:12px;line-height:1.5;color:var(--muted)}.tone-input{background:#0d172b;border:1px solid #35415c;color:#f7f4ff;border-radius:13px;padding:12px 14px;width:100%;font-size:16px;letter-spacing:4px;margin-top:8px}.card-lecture{margin:10px 0 13px;background:#2d3254;border:1px solid #4a4f7d;border-radius:14px;padding:11px 13px;display:flex;gap:9px;align-items:flex-start;font-size:12px;color:#ced4fc;line-height:1.5}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.big-btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;border:0;border-radius:17px;padding:15px 12px;font-size:14px;font-weight:800;color:white;background:linear-gradient(130deg,#9289ff,#675bea)}.big-btn.sec{background:#28334e;color:#e5e8ff;border:1px solid #414d6f}.big-btn.record{margin-top:12px;background:linear-gradient(125deg,#f07a9c,#ad56a1);padding:19px 13px;font-size:16px}.big-btn.record.active{background:linear-gradient(125deg,#ff636d,#c8416c);box-shadow:0 0 26px #ff6d8050;animation:pulse 1.5s infinite}@keyframes pulse{50%{box-shadow:0 0 36px #ff647caa}}.monitor{height:23px;display:flex;align-items:center;gap:4px;justify-content:center}.bar{height:5px;width:5px;border-radius:6px;background:#66dbce;transition:height .1s}.plot{width:100%;height:226px;border-radius:19px;background:#111b34;border:1px solid #334463;display:block;margin-top:15px}.legend{display:flex;flex-wrap:wrap;align-items:center;gap:16px;margin-top:12px;color:#b4c1dc;font-size:11px}.legend-dot{display:inline-block;width:9px;height:9px;border-radius:100%;margin-right:5px}.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{background:#101a31;border:1px solid #34405c;border-radius:15px;padding:13px 8px;text-align:center}.stat-value{font-size:23px;font-weight:850}.stat-label{font-size:11px;color:var(--muted);margin-top:5px}.score{display:flex;align-items:center;justify-content:space-between;gap:16px}.score-number{font-size:47px;font-weight:900;color:#a8f4dd;letter-spacing:-2px}.score-caption{font-size:11px;color:var(--muted);margin-top:-7px}.result-head{font-size:19px;font-weight:800}.recognition{background:#0b1930;border-radius:15px;padding:14px;margin-top:14px;border:1px solid #304261}.recognition-actual{font-size:22px;letter-spacing:2px;margin:8px 0}.segment-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:8px;margin:13px 0}.segment{background:#111c34;border:1px solid #354261;border-radius:14px;padding:12px;text-align:center}.seg-name{font-size:15px;color:#d7d5ff;font-weight:800}.seg-score{font-size:21px;font-weight:800;margin:6px 0}.seg-extra{font-size:11px;color:var(--muted)}.list-card{background:#18223d;border:1px solid #34405d;border-radius:18px;padding:14px;margin:10px 0;display:flex;align-items:center;gap:12px}.list-hanzi{font-size:24px;font-weight:800;min-width:58px}.list-main{flex:1;min-width:0}.list-meta{font-size:12px;color:var(--muted);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.icon-btn{flex:none;width:39px;height:39px;border:1px solid #43506e;border-radius:12px;background:#26324d;color:#e0eaff;font-size:16px;display:grid;place-items:center}.list-title{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.list-action{font-size:12px;color:#b8afff;cursor:pointer}.empty{color:var(--muted);padding:25px 12px;line-height:1.6;text-align:center;border:1px dashed #435271;border-radius:19px;margin:15px 0}.quiz-prompt{font-size:66px;font-weight:800;text-align:center;padding:22px 0;letter-spacing:3px}.quiz-options{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.quiz-option{background:#1e2b49;border:1px solid #415172;border-radius:16px;padding:17px 7px;color:#f2f2ff;font-size:18px;font-weight:900}.quiz-option.good{background:#21524f;border-color:#61e1bd}.quiz-option.bad{background:#583344;border-color:#ff91a9}.progressbar{height:9px;border-radius:30px;background:#374464;overflow:hidden;margin-top:14px}.progressbar>div{height:100%;border-radius:30px;background:linear-gradient(90deg,#8274f9,#59d6c4);transition:width .2s}.heading-row{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:22px 0 11px}.heading-row h2{margin:0;font-size:20px;letter-spacing:-.5px}.filterbar{display:flex;overflow:auto;gap:8px;padding-bottom:4px}.section-muted{margin:0 0 18px;color:#a0abc9;font-size:13px;line-height:1.6}.badge-meaning{font-size:11px;color:#e4b9ee;background:#583b62;border-radius:8px;padding:5px 7px}.warning{padding:14px;border:1px solid #655739;background:#3b3325;color:#f5d8a4;border-radius:15px;font-size:12px;line-height:1.6;margin:14px 0}.soft-action{border:1px solid #4d5276;background:#262f4b;border-radius:12px;color:#d5d9ff;font-size:12px;padding:10px 12px}.footer-nav{position:fixed;bottom:0;left:0;right:0;padding:11px 12px calc(12px + env(safe-area-inset-bottom));background:#101831f4;backdrop-filter:blur(20px);border-top:1px solid #37415c;display:grid;grid-template-columns:repeat(5,1fr);gap:3px;z-index:10;max-width:680px;margin:0 auto}.nav-item{background:none;border:0;color:#8e9bb8;font-size:10px;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:6px}.nav-icon{height:26px;width:36px;border-radius:12px;display:grid;place-items:center;font-size:21px}.nav-item.current{color:#c5bdff;font-weight:800}.nav-item.current .nav-icon{background:#393560;color:#dbd6ff}.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);max-width:calc(100vw - 35px);width:max-content;padding:12px 18px;background:#38345b;color:white;border-radius:15px;box-shadow:0 14px 40px #0008;z-index:25;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s}.toast.open{opacity:1}.meter{display:none;gap:4px;align-items:center;height:25px;justify-content:center;margin:12px auto}.meter.open{display:flex}
@media(min-width:540px){.page{padding:30px 34px 130px}.big-title{font-size:39px}.header{margin-bottom:32px}.card{padding:23px}.footer-nav{padding:12px 30px 16px}}@media(max-width:350px){.page{padding-left:12px;padding-right:12px}.brandname{font-size:15px}.model-badge{font-size:9px;padding:7px}}
</style>
</head>
<body>
<div id="app"></div><div id="toast" class="toast"></div>
<script>
(function(){'use strict';
const lessons=[
{t:'妈',p:'mā',m:'мама',lvl:'Тоны'}, {t:'麻',p:'má',m:'конопля',lvl:'Тоны'},{t:'马',p:'mǎ',m:'лошадь',lvl:'Тоны'},{t:'骂',p:'mà',m:'ругать',lvl:'Тоны'},{t:'吗',p:'ma',m:'частица вопроса',lvl:'Тоны'},
{t:'你好',p:'nǐ hǎo',m:'привет',lvl:'HSK 1'},{t:'谢谢',p:'xiè xie',m:'спасибо',lvl:'HSK 1'},{t:'中国',p:'zhōng guó',m:'Китай',lvl:'HSK 1'},{t:'老师',p:'lǎo shī',m:'учитель',lvl:'HSK 1'},{t:'朋友',p:'péng you',m:'друг',lvl:'HSK 1'},{t:'学习',p:'xué xí',m:'учиться',lvl:'HSK 1'},{t:'天气',p:'tiān qì',m:'погода',lvl:'HSK 1'},
{t:'我喜欢你',p:'wǒ xǐ huān nǐ',m:'ты мне нравишься',lvl:'Фразы'},{t:'你会说中文吗',p:'nǐ huì shuō zhōng wén ma',m:'ты говоришь по-китайски?',lvl:'Фразы'},{t:'我想喝水',p:'wǒ xiǎng hē shuǐ',m:'я хочу пить',lvl:'Фразы'},{t:'今天很忙',p:'jīn tiān hěn máng',m:'сегодня я занят',lvl:'Фразы'},{t:'你叫什么名字',p:'nǐ jiào shén me míng zi',m:'как тебя зовут?',lvl:'Фразы'},
{t:'不是',p:'bú shì',m:'не является',lvl:'Сандхи'},{t:'一个',p:'yí gè',m:'один',lvl:'Сандхи'},{t:'很好',p:'hěn hǎo',m:'очень хорошо',lvl:'Сандхи'},{t:'可以',p:'kě yǐ',m:'можно',lvl:'Сандхи'},
{t:'银行',p:'yín háng',m:'банк',lvl:'HSK 2'},{t:'工作',p:'gōng zuò',m:'работа',lvl:'HSK 2'},{t:'因为',p:'yīn wèi',m:'потому что',lvl:'HSK 2'},{t:'开始',p:'kāi shǐ',m:'начинать',lvl:'HSK 2'}
];
const toneNames=['','ровный','восходящий','низкий / изгиб','нисходящий','нейтральный'];
const state={tab:'studio',text:'你好',manual:'',edit:false,preview:{syllables:[],tones:[]},saved:[],history:[],model:'loading',modelMessage:'Подготовка офлайн-модели',result:null,recording:false,working:false,voice:true,level:0,sec:0,quiz:null,quizAttempts:0,quizCorrect:0,filter:'Все'};
const $=x=>document.getElementById(x),q=s=>encodeURIComponent(String(s)).replace(/'/g,'%27'),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const native=(name,...args)=>{try{if(window.Native&&typeof Native[name]==='function')return Native[name](...args)}catch(e){toast('Android недоступен: '+e.message)}};
function toast(msg){let el=$('toast');if(!el)return;el.textContent=msg;el.classList.add('open');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('open'),2900)}
function el(tag,cls,text){let x=document.createElement(tag);if(cls)x.className=cls;if(text!=null)x.textContent=text;return x}
function header(){let ready=state.model==='ready';return `<header class="header"><div class="logo"><div class="logo-mark">声</div><div><div class="brandname">Mandarin Tone Coach</div><div class="brandtag">Speak. See. Improve.</div></div></div><button class="model-badge" onclick="MTC.go('settings')"><span class="dot ${ready?'ready':state.model==='error'?'error':''}"></span>${ready?'ML офлайн':'ML: '+(state.model==='error'?'ошибка':'загрузка')}</button></header>`}
function bottom(){const tabs=[['studio','◉','Студия'],['library','▦','Уроки'],['quiz','♬','Слух'],['history','▥','Прогресс'],['settings','⚙','О проекте']];return `<nav class="footer-nav">${tabs.map(([id,ic,name])=>`<button class="nav-item ${state.tab===id?'current':''}" onclick="MTC.go('${id}')"><span class="nav-icon">${ic}</span><span>${name}</span></button>`).join('')}</nav>`}
function studio(){let p=state.preview;let tones=p.tones||[];let syl=p.syllables||[];const result=state.result;
return `<div class="eyebrow">ПЕРСОНАЛЬНАЯ СТУДИЯ</div><h1 class="big-title">Произнеси <span class="highlight">точно.</span><br>Увидь свой тон.</h1><p class="sub">Введи любое китайское слово или фразу. Слушай пример, записывай голос и сравнивай интонацию.</p>
<div class="card glow"><div class="card-head"><span class="card-title">Мой текст</span><span class="pill">自由练习 · Свободная практика</span></div><textarea class="field" id="text-field" maxlength="100" lang="zh-CN" placeholder="Например: 我喜欢学习中文" oninput="MTC.editText(this.value)">${esc(state.text)}</textarea><div class="chips">${lessons.slice(0,8).filter(x=>x.t.length>1).slice(0,5).map(x=>`<button class="chip" onclick="MTC.select('${x.t}')">${x.t}</button>`).join('')}</div>
<div class="card-lecture"><span style="font-size:18px">✦</span><span>Можно вводить собственные иероглифы. Пиньинь определяется по словарю, но для многозначных иероглифов его необходимо проверить.</span></div>
<div class="caption">ПРЕДПОЛАГАЕМОЕ ЧТЕНИЕ</div><div id="pinyin-live" class="pinyin-line">${esc(syl.join(' · ')||'Ожидаю текст...')}</div><div id="tone-live" class="tones" style="margin-top:11px">${tones.map(n=>`<span class="tone-pill t${n}">${n}</span>`).join('')}</div>
<div style="margin-top:16px"><div class="caption">СКОРРЕКТИРОВАТЬ ТОНЫ (1–5)</div><div class="helper">По одной цифре на слог, например <b>2 3 4</b>. Исправь, если словарь или сандхи ошиблись.</div><input class="tone-input" id="tone-field" inputmode="numeric" placeholder="1 2 3 4" value="${esc(state.manual)}" oninput="MTC.editTones(this.value)"></div>
<div class="actions"><button class="big-btn sec" onclick="MTC.listen()">▷ Прослушать</button><button class="big-btn sec" onclick="MTC.savePhrase()">☆ Сохранить</button></div>
<button class="big-btn record ${state.recording?'active':''}" id="record-btn" onclick="MTC.record()" ${state.working?'disabled':''}>${state.working?'◌ Анализируем…':state.recording?'■ Остановить запись':'● Записать произношение'}</button>
<div id="meter" class="meter ${state.recording?'open':''}">${Array.from({length:25},()=>'<span class="bar"></span>').join('')}</div>
<p id="record-time" class="helper" style="text-align:center;margin:9px 0 0">${state.recording?'Идёт запись…':state.working?'Считаем F0 и распознаём речь локально':'Записи до 14 секунд · голос остаётся на телефоне'}</p></div>
${result?results(result):`<div class="card"><div class="card-head"><span class="card-title">Контур интонации</span><span class="pill">F0 · полутон</span></div><div class="helper">После записи здесь появится сравнение твоего голоса и целевых тонов.</div><canvas class="plot" id="pitch-canvas"></canvas><div class="legend"><span><i class="legend-dot" style="background:#9287ff"></i>Ожидаемая интонация</span><span><i class="legend-dot" style="background:#59d9d0"></i>Твоя речь</span></div></div>`}`}
function results(r){let recognized=String(r.recognized||'');const feedback=r.shapeScore>=78?'Хорошее совпадение формы':r.shapeScore>=50?'Есть что улучшить':'Попробуй ещё раз';let has=r.segments&&r.segments.length;
return `<div class="card"><div class="card-head"><span class="card-title">Результат попытки</span><span class="pill">${r.seconds?r.seconds.toFixed(1):'—'} сек</span></div><div class="score"><div><div class="result-head">${feedback}</div><div class="helper">Приблизительное совпадение формы F0</div></div><div><div class="score-number">${r.shapeScore<0?'—':r.shapeScore}</div><div class="score-caption">из 100 · форма</div></div></div>
<div class="stat-grid" style="margin-top:16px"><div class="stat"><div class="stat-value">${r.voicedPercent??0}%</div><div class="stat-label">голосовых кадров</div></div><div class="stat"><div class="stat-value">${has}</div><div class="stat-label">слогов</div></div><div class="stat"><div class="stat-value">${r.recognitionReady?String(r.recognitionSimilarity||0)+'%':'—'}</div><div class="stat-label">совпадение текста</div></div></div>
<canvas class="plot" id="pitch-canvas"></canvas><div class="legend"><span><i class="legend-dot" style="background:#9287ff"></i>Цель</span><span><i class="legend-dot" style="background:#59d9d0"></i>Голос</span></div>
<div class="heading-row"><h2>По слогам</h2><span class="tiny">Оценка условная</span></div><div class="segment-list">${(r.segments||[]).map(s=>`<div class="segment"><div class="seg-name">${esc(s.syllable)}</div><div class="seg-score" style="color:${s.score>=78?'#67e8ac':s.score>=50?'#ffd38f':'#ff96aa'}">${s.score<0?'—':s.score}</div><div class="seg-extra">цель ${s.expected} · найден ${s.guessed||'?'}</div></div>`).join('')}</div>
<div class="recognition"><div class="caption">РАСПОЗНАННЫЕ СЛОВА · VOSK</div><div class="recognition-actual">${r.recognitionReady?(recognized?esc(recognized):'<span style="font-size:13px;color:#9eabc9">Модель не разобрала текст</span>'):'<span style="font-size:13px;color:#9eabc9">Модель ещё не готова</span>'}</div><div class="helper">Ожидалось: ${esc(r.text)}. Совпадение текста не является отдельной оценкой китайского тона.</div></div>
<div class="warning">⚠ ${esc(r.note||'Это не экспертная оценка произношения.')}</div><button class="big-btn sec" onclick="MTC.record()">↻ Повторить упражнение</button></div>`}
function library(){let categories=['Все','Тоны','HSK 1','HSK 2','Фразы','Сандхи'];let filter=state.filter;const filtered=filter==='Все'?lessons:lessons.filter(x=>x.lvl===filter);
return `<div class="eyebrow">ТВОЙ НАБОР УПРАЖНЕНИЙ</div><h1 class="big-title">Практика каждый день.</h1><p class="sub">Готовые примеры или свои собственные слова — всё доступно без аккаунта.</p><div class="card glow"><div class="heading-row" style="margin-top:0"><h2>Моя коллекция</h2><span class="pill">${state.saved.length} сохранено</span></div>${state.saved.length?state.saved.map(x=>`<div class="list-card"><div class="list-main"><div class="list-title">${esc(x.text)}</div><div class="list-meta">${esc(x.tones||'Свободная практика')}</div></div><button class="icon-btn" onclick="MTC.loadSaved('${q(x.text)}')">↗</button><button class="icon-btn" onclick="MTC.removeSaved('${q(x.text)}')">×</button></div>`).join(''):'<div class="empty">Добавляй свои выражения кнопкой ☆ из студии. Они сохраняются прямо на Fold5.</div>'}</div><div class="heading-row"><h2>Готовые уроки</h2><span class="tiny">${filtered.length} примеров</span></div><div class="filterbar">${categories.map(c=>`<button class="chip ${filter===c?'selected':''}" onclick="MTC.filter('${c}')">${c}</button>`).join('')}</div><div style="margin-top:18px">${filtered.map(x=>`<div class="list-card"><div class="list-hanzi">${esc(x.t)}</div><div class="list-main"><div class="list-title">${esc(x.p)}</div><div class="list-meta">${esc(x.m)}</div></div><button class="icon-btn" onclick="MTC.listen('${x.t}')">▷</button><button class="icon-btn" onclick="MTC.select('${x.t}')">↗</button></div>`).join('')}</div>`}
function quiz(){if(!state.quiz)nextQuiz();let q=state.quiz;return `<div class="eyebrow">СЛУШАЙ И УГАДЫВАЙ</div><h1 class="big-title">Узнавай тон <span class="highlight">на слух.</span></h1><p class="sub">Слушай китайский слог и выбирай тон. Для этого режима нужна установленная китайская голосовая система TTS.</p><div class="card glow"><div class="row between"><span class="pill">Вопрос ${state.quizAttempts+1}</span><span class="tiny">${state.quizCorrect} верных ответов</span></div><div class="quiz-prompt">${esc(q.word)}</div><div class="helper" style="text-align:center">Нажми, чтобы услышать произношение, затем выбери тон</div><div class="actions" style="grid-template-columns:1fr"><button class="big-btn" onclick="MTC.listen('${q.word}')">▷ Слушать снова</button></div><div class="quiz-options">${[1,2,3,4,5].map(n=>`<button class="quiz-option ${q.done?(n===q.answer?'good':n===q.chosen?'bad':''):''}" ${q.done?'disabled':''} onclick="MTC.answer(${n})">${n} <span style="font-size:11px;font-weight:400">${toneNames[n]}</span></button>`).join('')}</div>${q.done?`<div class="warning">${q.chosen===q.answer?'✓ Верно!':'Правильный ответ: '+q.answer+' ('+toneNames[q.answer]+')'}</div><button class="big-btn" onclick="MTC.nextQuiz()">Следующий вопрос →</button>`:''}</div><p class="helper">Совет: сначала различай первый и четвёртый, затем второй и третий. Нейтральный тон зависит от контекста.</p>`}
function history(){const hist=state.history||[];let graded=hist.filter(r=>r.score>=0);let avg=graded.length?Math.round(graded.reduce((s,r)=>s+r.score,0)/graded.length):0;let practiced=new Set(hist.map(x=>x.text)).size;
let perTone={};for(const h of hist){for(const t of (h.perTone||[])){if(t.expected>=1&&t.expected<=4&&t.score>=0){let a=perTone[t.expected]||{total:0,n:0};a.total+=t.score;a.n++;perTone[t.expected]=a;}}}
const toneProgress=Object.entries(perTone).sort((a,b)=>(a[1].total/a[1].n)-(b[1].total/b[1].n));
return `<div class="eyebrow">ТВОЙ ПУТЬ</div><h1 class="big-title">Каждая попытка <span class="highlight">имеет значение.</span></h1><p class="sub">Твой прогресс хранится только на устройстве. Здесь нет облачной учётной записи.</p><div class="card glow"><div class="stat-grid"><div class="stat"><div class="stat-value">${hist.length}</div><div class="stat-label">записей</div></div><div class="stat"><div class="stat-value">${avg}</div><div class="stat-label">средняя форма</div></div><div class="stat"><div class="stat-value">${practiced}</div><div class="stat-label">разных фраз</div></div></div><div class="caption" style="margin-top:20px">СРЕДНИЙ БАЛЛ</div><div class="progressbar"><div style="width:${avg}%"></div></div></div>${toneProgress.length?`<div class="card"><div class="card-head"><span class="card-title">Тоны для повторения</span><span class="tiny">Сначала сложные</span></div>${toneProgress.map(([n,a])=>`<div style="margin:16px 0"><div class="row between"><span class="helper">Тон ${n} · ${toneNames[n]}</span><b>${Math.round(a.total/a.n)}/100</b></div><div class="progressbar" style="margin-top:7px"><div style="width:${Math.round(a.total/a.n)}%"></div></div></div>`).join('')}<p class="helper">По предыдущим записям; не является лингвистической аттестацией.</p></div>`:''}<div class="heading-row"><h2>Последние упражнения</h2>${hist.length?'<button class="soft-action" onclick="MTC.clearHistory()">Очистить</button>':''}</div>${hist.length?hist.map(x=>`<div class="list-card"><div class="list-main"><div class="list-title">${esc(x.text)}</div><div class="list-meta">${new Date(x.date).toLocaleString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})} · ${x.syllables||'?'} слогов</div></div><div style="text-align:right"><div style="font-size:22px;font-weight:900;color:#aadff2">${x.score<0?'—':x.score}</div><span class="tiny">F0</span></div><button class="icon-btn" onclick="MTC.select('${q(x.text)}',true)">↗</button></div>`).join(''):'<div class="empty">Пока нет попыток. Открой «Студия», запиши произношение — и первая запись появится здесь.</div>'}`}
function settings(){return `<div class="eyebrow">ТЕХНОЛОГИЯ И ЧЕСТНАЯ ОБРАТНАЯ СВЯЗЬ</div><h1 class="big-title">Офлайн. Локально. <span class="highlight">Твоё.</span></h1><p class="sub">Приложение устроено как маленькая речевая лаборатория на твоём Android.</p><div class="card glow"><div class="card-head"><span class="card-title">Распознавание речи</span><span class="pill">Vosk CN · Apache 2.0</span></div><h2 style="margin:9px 0">${state.model==='ready'?'✓ Модель готова':state.model==='loading'?'◌ Подготавливается':'! Проверь модель'}</h2><p class="helper">${esc(state.modelMessage)}</p><div class="progressbar"><div style="width:${state.model==='ready'?100:state.model==='loading'?55:5}%"></div></div><div class="warning">Китайская модель Vosk около 42 МБ в архиве. После установки она распаковывается в память телефона один раз. Интернет не нужен для анализа записей.</div></div><div class="card"><div class="card-title">Что именно проверяет оценка?</div><p class="section-muted" style="margin:14px 0 0"><b style="color:#e0e4ff">F0-контур:</b> изменения высоты основного тона голоса. Для каждого слога сравнивается форма с ожидаемым тоновым шаблоном.</p><p class="section-muted" style="margin:10px 0 0"><b style="color:#e0e4ff">Vosk:</b> распознаёт иероглифы речи. Это не гарантирует верность тона или артикуляции.</p><p class="section-muted" style="margin:10px 0 0"><b style="color:#e0e4ff">Важно:</b> автоматическая разбивка длинной речи на слоги приблизительная, а многозначные иероглифы и тоновые изменения требуют проверки.</p></div><div class="card"><div class="card-title">Конфиденциальность</div><p class="section-muted" style="margin:14px 0 0">Микрофон обрабатывается локально. Записанное аудио анализируется в памяти и не отправляется на сервер. Сохраняются только текст и итоговые оценки попыток.</p><p class="section-muted">Произношение примеров использует системный китайский TTS Android. Для полной офлайн-работы выбери заранее загруженный офлайн-голос.</p></div><div class="card"><div class="card-title">Mandarin Tone Coach 2.0 beta</div><p class="helper" style="margin-bottom:0">Сделано для практики китайских тонов на Android · Java + WebView · Vosk + YIN-подобная F0-обработка · Лицензии указаны в исходном проекте.</p></div>`}
function drawPlot(){let canvas=$('pitch-canvas');if(!canvas)return;const box=canvas.getBoundingClientRect(),dpr=Math.min(window.devicePixelRatio||1,3);if(box.width<50)return;canvas.width=Math.round(box.width*dpr);canvas.height=Math.round(box.height*dpr);let c=canvas.getContext('2d');c.scale(dpr,dpr);let w=box.width,h=box.height,pad=23;
c.strokeStyle='#2a3a59';c.lineWidth=1;for(let j=1;j<=5;j++){let y=pad+(h-2*pad)*j/6;c.beginPath();c.moveTo(pad,y);c.lineTo(w-pad,y);c.stroke()}
let r=state.result;let target=r&&r.targetCurve&&r.targetCurve.length?r.targetCurve:null;let actual=r&&r.curve&&r.curve.length?r.curve:null;if(!target){target=Array.from({length:90},(_,i)=>i<45?Math.round((-3+6*i/45)*100):Math.round((3-8*(i-45)/45)*100))}
const all=[...target,...(actual||[])];let lo=-950,hi=950;for(let a of all){if(Number.isFinite(a)){lo=Math.min(lo,a);hi=Math.max(hi,a)}}lo=Math.max(-1800,lo-110);hi=Math.min(1800,hi+110);if(hi-lo<200){hi+=100;lo-=100}
const line=(arr,color,weight)=>{if(!arr||arr.length<2)return;c.beginPath();c.lineWidth=weight;c.lineJoin='round';c.lineCap='round';c.strokeStyle=color;arr.forEach((v,i)=>{let x=pad+(w-2*pad)*i/(arr.length-1),y=pad+(h-pad*2)*(1-(v-lo)/(hi-lo));if(i===0)c.moveTo(x,y);else c.lineTo(x,y)});c.stroke()};line(target,'#988dff',3.1);line(actual,'#65e8da',2.8);
c.font='11px system-ui';c.fillStyle='#758aac';c.fillText('↑ ВЫШЕ',pad+2,16);c.fillText('ВРЕМЯ →',Math.max(pad,w-100),h-8);
}
function nextQuiz(){let subset=lessons.slice(0,5);let n=Math.floor(Math.random()*subset.length);state.quiz={word:subset[n].t,answer:n+1,chosen:0,done:false}}
function render(){let app=$('app');if(!app)return;let fn={studio,library,quiz,history,settings}[state.tab]||studio;app.innerHTML=`<main class="page">${header()}${fn()}</main>${bottom()}`;if(state.tab==='studio')requestAnimationFrame(drawPlot)}
function pick(text){state.text=String(text);state.result=null;state.manual='';state.edit=false;state.tab='studio';render();native('preview',state.text);window.scrollTo(0,0)}
window.MTC={
 onNative:function(raw){let msg;try{msg=JSON.parse(raw)}catch(e){return}let p=msg.payload||{};switch(msg.type){
 case 'boot':state.saved=Array.isArray(p.saved)?p.saved:[];state.history=Array.isArray(p.history)?p.history:[];state.quizAttempts=p.quizAttempts||0;state.quizCorrect=p.quizCorrect||0;state.model=p.modelStatus||'loading';state.modelMessage=p.modelMessage||'';render();break;
 case 'preview':if(p.text!==state.text)return;state.preview=p;if(!state.edit){state.manual=p.toneString||'';let f=$('tone-field');if(f)f.value=state.manual}let e=$('pinyin-live');if(e)e.textContent=(p.syllables||[]).join(' · ')||'Введите китайский текст';let t=$('tone-live');if(t)t.innerHTML=(p.tones||[]).map(n=>`<span class="tone-pill t${n}">${n}</span>`).join('');break;
 case 'saved':state.saved=p.items||[];if(state.tab==='library')render();break;
 case 'history':state.history=p.items||[];if(state.tab==='history')render();break;
 case 'model':state.model=p.status;state.modelMessage=p.message;render();break;
 case 'tts':state.voice=p.available;break;
 case 'quizStats':state.quizAttempts=p.attempts;state.quizCorrect=p.correct;break;
 case 'notice':toast(p.text);break;
 case 'recording':state.recording=p.active;state.working=false;let b=$('record-btn');if(b){b.textContent=p.active?'■ Остановить запись':'● Записать произношение';b.classList.toggle('active',p.active)}let m=$('meter');if(m)m.classList.toggle('open',p.active);break;
 case 'level':state.level=p.level;state.sec=p.seconds;let bars=document.querySelectorAll('.bar');bars.forEach((bar,i)=>{let v=Math.sin(i*.65+Date.now()/400)*.3+.7;bar.style.height=(5+Math.min(1,Math.max(0,p.level*2.4))*21*v)+'px'});let tt=$('record-time');if(tt)tt.textContent=`Запись: ${p.seconds.toFixed(1)} сек / 14 сек`;break;
 case 'working':state.working=p.active;let bb=$('record-btn');if(bb)bb.textContent=p.active?'◌ Анализируем…':'● Записать произношение';if(bb)bb.disabled=p.active;break;
 case 'analysis':state.result=p;state.recording=false;state.working=false;render();setTimeout(()=>{$('pitch-canvas')?.scrollIntoView({behavior:'smooth',block:'center'})},280);break;
 }} ,
 go:function(tab){state.tab=tab;render();window.scrollTo(0,0)},
 editText:function(text){state.text=text;state.manual='';state.edit=false;state.result=null;clearTimeout(window._previewTimer);window._previewTimer=setTimeout(()=>native('preview',text),260)},
 editTones:function(text){state.manual=text;state.edit=true},
 select:function(text,encoded){pick(encoded?decodeURIComponent(text):text)},
 loadSaved:function(text){let item=state.saved.find(s=>s.text===decodeURIComponent(text));if(!item)return;pick(item.text);if(item.tones){state.manual=item.tones;state.edit=true;let f=$('tone-field');if(f)f.value=item.tones}},
 savePhrase:function(){native('savePhrase',state.text,state.manual)},
 removeSaved:function(text){native('removePhrase',decodeURIComponent(text))},
 listen:function(text){native('speak',text||state.text)},
 record:function(){native('record',state.text,state.manual)},
 filter:function(x){state.filter=x;render()},
 nextQuiz:function(){nextQuiz();render()},
 answer:function(n){let q=state.quiz;if(q.done)return;q.chosen=n;q.done=true;state.quizAttempts++;if(n===q.answer)state.quizCorrect++;native('quizAnswer',n===q.answer);render();},
 clearHistory:function(){if(confirm('Очистить историю занятий на этом телефоне?'))native('clearHistory')}
};
window.addEventListener('resize',()=>{if(state.tab==='studio')drawPlot()});
render();native('ready');
})();
</script>
